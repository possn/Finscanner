name: Update stock data

on:
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * *"

permissions:
  contents: write

concurrency:
  group: finscanner-data-update-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Run pipeline
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python scripts/run.py

      - name: Validate generated data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          required = [Path("data/stocks.json"), Path("data/metals.json")]
          for path in required:
              if not path.exists() or path.stat().st_size == 0:
                  raise SystemExit(f"Missing/empty generated file: {path}")
              json.loads(path.read_text())
          payload = json.loads(Path("data/stocks.json").read_text())
          stocks = payload.get("stocks")
          if not isinstance(stocks, list) or not stocks:
              raise SystemExit("data/stocks.json has no non-empty stocks array")
          print(f"Validated {len(stocks)} instruments")
          PY

      - name: Publish generated data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "finscanner-bot"
          git config user.email "actions@users.noreply.github.com"

          rm -rf /tmp/finscanner-generated
          mkdir -p /tmp/finscanner-generated/data
          for f in \
            data/stocks.json \
            data/metals.json \
            data/history.json \
            data/valuation_history.json \
            data/thesis_history.json \
            data/last_error.log \
            data/pipeline_log.txt; do
            [ -f "$f" ] && cp "$f" "/tmp/finscanner-generated/data/$(basename "$f")"
          done

          for attempt in 1 2 3; do
            echo "Publish attempt ${attempt}/3"
            git fetch origin main
            git reset --hard origin/main
            cp -f /tmp/finscanner-generated/data/* data/ 2>/dev/null || true

            for f in \
              data/stocks.json \
              data/metals.json \
              data/history.json \
              data/valuation_history.json \
              data/thesis_history.json \
              data/last_error.log \
              data/pipeline_log.txt; do
              [ -f "$f" ] && git add "$f"
            done
            if git diff --cached --quiet; then
              echo "No generated-data changes to publish."
              exit 0
            fi

            git commit -m "chore: daily data update $(date -u +%Y-%m-%d)"
            if git push origin HEAD:main; then
              echo "Data update published successfully."
              exit 0
            fi

            echo "Remote main changed during publish; retrying from current origin/main."
            sleep $((attempt * 2))
          done

          echo "Failed to publish after 3 attempts."
          exit 1
