name: Update stock data

on:
  schedule:
    # 06:15 UTC daily — after US market close data settles, before EU morning
    - cron: "15 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run pipeline
        run: python scripts/run.py
        continue-on-error: true
        id: pipeline

      - name: Commit updated data
        if: always()
        run: |
          git config user.name "finscanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/stocks.json 2>/dev/null || true
          git add data/metals.json 2>/dev/null || true
          git add data/history.json 2>/dev/null || true
          git add data/last_error.log 2>/dev/null || true
          git add data/pipeline_log.txt 2>/dev/null || true
          git diff --quiet --cached || git commit -m "chore: daily data update $(date -u +%Y-%m-%d)"
          git push

      - name: Fail job if pipeline failed
        if: steps.pipeline.outcome == 'failure'
        run: exit 1
