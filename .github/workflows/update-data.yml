name: Update stock data

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. We schedule both possible UTC times for 06:00 Europe/Lisbon
    # and keep only the run whose local Portugal hour is actually 06 (handles DST).
    - cron: "0 5 * * *"
    - cron: "0 6 * * *"

permissions:
  contents: write

concurrency:
  group: finscanner-data-update-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check Portugal 06:00 window
        id: portugal_clock
        shell: bash
        run: |
          hour=$(TZ=Europe/Lisbon date +%H)
          echo "Portugal local hour: ${hour}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$hour" = "06" ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "run=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.portugal_clock.outputs.run == 'yes'

        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        if: steps.portugal_clock.outputs.run == 'yes'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        if: steps.portugal_clock.outputs.run == 'yes'
        run: python -m pip install -r scripts/requirements.txt

      - name: Run pipeline
        if: steps.portugal_clock.outputs.run == 'yes'
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          FINSCANNER_FETCH_WORKERS: "5"
          FINSCANNER_SEC_WORKERS: "3"
          FINSCANNER_SEC_MIN_INTERVAL: "0.13"
          FINSCANNER_ANALYST_MAX: "800"
          FINSCANNER_ANALYST_WORKERS: "8"
        run: python scripts/run.py

      - name: Validate generated data
        if: steps.portugal_clock.outputs.run == 'yes'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          required = [Path("data/stocks.json"), Path("data/metals.json"), Path("data/metals_brief.json"), Path("data/fx.json"), Path("data/fx_history.json"), Path("data/metals_history.json")]
          for path in required:
              if not path.exists() or path.stat().st_size == 0:
                  raise SystemExit(f"Missing/empty generated file: {path}")
              json.loads(path.read_text())
          payload = json.loads(Path("data/stocks.json").read_text())
          stocks = payload.get("stocks")
          if not isinstance(stocks, list) or not stocks:
              raise SystemExit("data/stocks.json has no non-empty stocks array")
          if int(payload.get("schema_version", 0)) < 48:
              raise SystemExit(f"Old stocks schema: {payload.get('schema_version')}")
          fx = json.loads(Path("data/fx.json").read_text())
          rates = fx.get("rates_to_eur") or {}
          fx_hist = json.loads(Path("data/fx_history.json").read_text())
          hist_series = fx_hist.get("series") or {}
          if len(hist_series.get("USD") or []) < 100:
              raise SystemExit("Historical FX coverage incomplete: USD series missing/too short")
          required_fx = ["USD", "GBP", "CHF", "CAD", "PLN", "SEK", "DKK"]
          missing_fx = [c for c in required_fx if not isinstance(rates.get(c), (int, float)) or float(rates[c]) <= 0]
          if missing_fx:
              raise SystemExit(f"FX coverage incomplete: {', '.join(missing_fx)}")
          quality = payload.get("data_quality") or {}
          requested = int(quality.get("portfolio_extra_requested", 0) or 0)
          covered = int(quality.get("portfolio_extra_covered", 0) or 0)
          pct = float(quality.get("portfolio_extra_coverage_pct", 0) or 0)
          etf_rows = int(quality.get("etf_rows", 0) or 0)
          etf_holdings = int(quality.get("etf_rows_with_holdings", 0) or 0)
          if requested and pct < 50:
              raise SystemExit(f"Portfolio coverage too low: {covered}/{requested} ({pct:.1f}%)")
          if etf_rows and etf_holdings == 0:
              raise SystemExit(f"ETF metadata regression: 0/{etf_rows} ETF rows have holdings")
          insider_us = int(quality.get("insider_us_equities", 0) or 0)
          insider_ok = int(quality.get("insider_sec_ok", 0) or 0)
          insider_cov = float(quality.get("insider_sec_coverage_pct", 0) or 0)
          insider_ps = int(quality.get("insider_rows_with_open_market_ps_30d", 0) or 0)
          if insider_us and insider_cov < 50:
              raise SystemExit(f"SEC insider coverage too low: {insider_ok}/{insider_us} ({insider_cov:.1f}%)")
          analyst_req = int(quality.get("analyst_rows_requested", 0) or 0)
          analyst_ok = int(quality.get("analyst_rows_ok", 0) or 0)
          analyst_partial = int(quality.get("analyst_rows_partial", 0) or 0)
          analyst_rev = int(quality.get("analyst_rows_with_revisions", 0) or 0)
          analyst_earn = int(quality.get("analyst_rows_with_next_earnings", 0) or 0)
          analyst_cov = float(quality.get("analyst_coverage_pct", 0) or 0)
          if analyst_req >= 50 and (analyst_ok + analyst_partial) == 0:
              raise SystemExit(f"Analyst intelligence regression: 0/{analyst_req} rows returned any estimate data")
          print(f"Validated {len(stocks)} instruments · portfolio {covered}/{requested} ({pct:.1f}%) · ETF holdings {etf_holdings}/{etf_rows} · SEC insiders {insider_ok}/{insider_us} ({insider_cov:.1f}%), P/S signals {insider_ps} · analyst {analyst_ok+analyst_partial}/{analyst_req} ({analyst_cov:.1f}%), revisions {analyst_rev}, earnings dates {analyst_earn} · FX OK")
          PY

      - name: Publish generated data
        if: steps.portugal_clock.outputs.run == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "finscanner-bot"
          git config user.email "actions@users.noreply.github.com"

          rm -rf /tmp/finscanner-generated
          mkdir -p /tmp/finscanner-generated/data
          for f in \
            data/stocks.json \
            data/metals.json \
            data/metals_history.json \
            data/metals_brief.json \
            data/fx.json \
            data/fx_history.json \
            data/history.json \
            data/valuation_history.json \
            data/thesis_history.json \
            data/news.json \
            data/last_error.log \
            data/pipeline_log.txt; do
            [ -f "$f" ] && cp "$f" "/tmp/finscanner-generated/data/$(basename "$f")"
          done

          for attempt in 1 2 3; do
            echo "Publish attempt ${attempt}/3"
            git fetch origin main
            git reset --hard origin/main
            cp -f /tmp/finscanner-generated/data/* data/ 2>/dev/null || true

            for f in \
              data/stocks.json \
              data/metals.json \
              data/metals_history.json \
              data/metals_brief.json \
              data/fx.json \
              data/fx_history.json \
              data/history.json \
              data/valuation_history.json \
              data/thesis_history.json \
              data/news.json \
              data/last_error.log \
              data/pipeline_log.txt; do
              [ -f "$f" ] && git add "$f"
            done
            if git diff --cached --quiet; then
              echo "No generated-data changes to publish."
              exit 0
            fi

            git commit -m "chore: daily data update $(date -u +%Y-%m-%d)"
            if git push origin HEAD:main; then
              echo "Data update published successfully."
              exit 0
            fi

            echo "Remote main changed during publish; retrying from current origin/main."
            sleep $((attempt * 2))
          done

          echo "Failed to publish after 3 attempts."
          exit 1
